<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Tabel Pertama -->
    <h1>Tabel dengan <abbr title="Column Span">Colspan</abbr></h1>
    <table border="1" width="50%">
    <tr>
        <th colspan="2" width="60%">Name</th>
        <th width="40%">Age</th>
    </tr>
    <tr>
        <td width="30%" align="center">Jill</td>
        <td width="30%" align="center">Smith</td>
        <td width="40%" align="center">43</td>
    </tr>
    <tr>
        <td width="30%" align="center">Eve</td>
        <td width="30%" align="center">Jackson</td>
        <td width="40%" align="center">57</td>
    </tr>
    </table><br><!-- Tabel Kedua -->
    <h1>Tabel dengan <abbr title="Row Span">Rowspan</abbr></h1>
    <table border="1">
    <tr>
        <th>Name</th>
        <td>Jill Smith</td>
    </tr>
    <tr>
        <th rowspan="2">Phone</th>
        <td>555-1234</td>
    </tr>
    <tr>
        <td>555-8745</td>
    </tr>
    </table>
</body>
</html>
